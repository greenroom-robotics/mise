# Run `pre-commit install` once per clone to activate these hooks.
# Runs cargo fmt from the pixi dev environment, the same toolchain CI uses.
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: pixi run -e dev cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false
