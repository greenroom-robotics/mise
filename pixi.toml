[workspace]
name = "mise"
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64", "linux-aarch64"]
preview = ["pixi-build"]

[dependencies]
mise = { path = "." }

[tasks]
mise = "mise"

[package]
name = "mise"
version = "9.0.1"

[package.build-dependencies]
rust = "1.100.*"

[package.build.backend]
channels = [
  "https://prefix.dev/pixi-build-backends",
  "https://prefix.dev/conda-forge",
]
name = "pixi-build-rust"
version = "*"

[feature.dev.dependencies]
rust = "1.100.*"
cargo-nextest = ">=0.9.143,<0.10"

[feature.dev.tasks]
lint = "cargo fmt --all && cargo clippy --all-targets --all-features --fix --allow-dirty --allow-staged -- -D warnings"
lint-check = "cargo fmt --all --check && cargo clippy --all-targets --all-features --locked -- -D warnings"
test = "cargo nextest run --locked --color always && cargo test --doc --locked"

[environments]
dev = { features = ["dev"], no-default-feature = true }
