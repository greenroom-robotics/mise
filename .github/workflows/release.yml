name: release
on:
  push:
    branches: [main]
jobs:
  # Ensures the `v<MAJOR>` tags this commit's internal refs point at actually
  # exist, BEFORE the release job starts.
  #
  # Why this job exists: GitHub resolves *every* nested `uses:` of a composite
  # action during "Prepare all required actions", which happens at job start —
  # before any `if:` is evaluated. The release action internally pins
  # `greenroom-robotics/mise/.github/actions/setup@v<MAJOR>`, and even though
  # this workflow passes `skip-setup: "true"` so that step never runs, the ref
  # must still resolve. Releasing major N therefore requires `vN` to already
  # exist — a chicken-and-egg deadlock, since the release that creates `vN` is
  # exactly the one that cannot start ("Unable to resolve action
  # greenroom-robotics/mise@v8, unable to find version v8").
  #
  # Why a separate, earlier job and not a step inside `release`: the eager
  # resolution happens at `release`'s job start, so any step within it runs too
  # late. `needs:` is what guarantees the tag exists first. Do not inline this.
  #
  # This is what makes the "one-step" refs bump that tests/internal_action_refs.rs
  # enforces viable: the breaking PR bumps the refs itself, so the
  # `chore(release)` commit inherits correct refs and the tag `update-major-tag`
  # later slides captures a correct tree.
  ensure-major-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Same token pattern as update-major-tag below: pushing a ref that points
      # at a commit touching .github/workflows/ requires the Workflows
      # permission, which the default GITHUB_TOKEN cannot be granted.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Create missing major tag at HEAD
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          # Target major = the highest major pinned by the internal refs under
          # .github — literally "the majors this commit must be able to
          # resolve". Derived from the refs rather than from semantic-release's
          # next version so we don't duplicate its bump logic.
          # Note the `.` in the character class: one ref is
          # `.../workflows/ci-test.yml@v8`, which `[a-z-]+` would miss.
          MAJOR="$(grep -rhoE 'greenroom-robotics/mise/\.github/[a-z.-]+/[a-z.-]+@v[0-9]+' .github \
            | grep -oE '[0-9]+$' | sort -n | tail -1)"
          if [ -z "${MAJOR:-}" ]; then
            echo "No internal greenroom-robotics/mise refs found; nothing to ensure."
            exit 0
          fi
          SLIDING="v${MAJOR}"
          if git ls-remote --exit-code --tags origin "refs/tags/${SLIDING}" >/dev/null 2>&1; then
            echo "${SLIDING} already exists; nothing to do."
            exit 0
          fi
          # Never move an existing tag — update-major-tag owns sliding it after
          # a release. This only ever creates a tag that is entirely absent.
          echo "Creating ${SLIDING} at $(git rev-parse HEAD)"
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git tag "$SLIDING" HEAD
          git push origin "refs/tags/${SLIDING}"

  release:
    needs: ensure-major-tag
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Azure OIDC login in the release action
      contents: write # semantic-release commits CHANGELOG + cuts tags
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Dogfood the in-repo setup via a workflow-level local path. A relative
      # `uses: ./` inside a composite action resolves against the *consumer's*
      # workspace, so the release action can't reference local setup without
      # breaking external consumers — but at the workflow level `./` is this
      # repo's checkout. Running setup here (not the release action's pinned
      # setup@v2) means a fix living in setup itself takes effect on the same
      # run, instead of being stuck behind the v2 tag this job later slides.
      - id: setup
        uses: ./.github/actions/setup
        with:
          gh-app-client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          gh-app-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          # Build the binary below instead of downloading one. setup installs
          # the mise release named by pixi.toml, which during *this* job is
          # still the previous version — and on the very first run of this
          # workflow shape, that release has no binary assets at all. Building
          # from source also means the release is cut by the code it publishes.
          skip-mise: "true"

      - name: Build the mise being released
        run: |
          cargo build --release
          echo "$PWD/target/release" >> "$GITHUB_PATH"

      # mise releases itself through its own action (the path it provides to
      # other pixi-native repos), not the deprecated recipes-release.yml.
      # package-dir "." -> the root pixi.toml is the package (see ci discover).
      # skip-setup -> reuse the setup above instead of the action's setup@v2.
      #
      # extra-prepare-cmd + extra-git-assets fold the Cargo.toml/Cargo.lock bump
      # into the same `chore(release)` commit and tag as pixi.toml, so
      # `mise --version` (CARGO_PKG_VERSION) tracks the released package without
      # a follow-up commit. This Rust-specific wiring lives here, not in the
      # generic `mise ci release` path which stays Cargo-agnostic.
      - uses: ./.github/actions/release
        with:
          skip-setup: "true"
          gh-token: ${{ steps.setup.outputs.gh-token }}
          gh-app-client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          gh-app-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          package-dir: "."
          extra-git-assets: "Cargo.toml Cargo.lock"
          extra-prepare-cmd: "mise ci sync-cargo --version=${nextRelease.version}"

  # Attaches statically linked binaries to the GitHub release the job above
  # created (@semantic-release/github), one per platform in pixi.toml. This is
  # what `setup` downloads, so it must land before update-major-tag slides
  # v<MAJOR> onto this commit — a consumer pinned at v<MAJOR> reads the bumped
  # version out of pixi.toml and asks for that release's asset by name.
  #
  # Native runners per arch rather than `cross`: no Docker pull, no
  # `cargo install cross`. The musl targets ship their own libc for
  # self-contained linking, so there's no musl-tools step either.
  binaries:
    needs: release
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write # uploading release assets
    steps:
      # fetch-depth 0 for the tags: the release job pushed mise@X.Y.Z to this
      # branch tip, and the tag is how the upload finds its release.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: tag
        run: echo "ref=refs/tags/$(git tag -l 'mise@*' | sort -V | tail -1)" >> "$GITHUB_OUTPUT"

      - run: rustup target add ${{ matrix.target }}

      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: mise
          target: ${{ matrix.target }}
          # The workflow runs on push, not on the tag, so GITHUB_REF points at
          # main and the action needs the tag spelled out.
          ref: ${{ steps.tag.outputs.ref }}
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  # Slides the bare `v<MAJOR>` tag (e.g. `v1`, `v2`) forward whenever the
  # release job above cuts a new exact `mise@X.Y.Z` tag. Consumers pin
  # `uses: greenroom-robotics/mise/.github/actions/<name>@v<MAJOR>` and
  # automatically pick up minor/patch updates to the composite actions.
  #
  # This runs as a job here becase detecting a tag push will not trigger
  # any workflows since the tag is pushed by github app
  #
  # With ensure-major-tag above, internal refs are bumped in the breaking PR
  # itself, so the `chore(release)` commit inherits already-correct refs and the
  # tree this slide lands on is the correct one. (Bumping refs in a follow-up
  # commit instead leaves the slid tag pointing at the pre-bump release commit,
  # which the tripwire test cannot catch — it validates the working tree, not
  # whatever commit the tag ends up on.)
  update-major-tag:
    needs: [release, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # App token, not the default GITHUB_TOKEN: sliding v<MAJOR> can move the
      # tag across a commit that edits a file under .github/workflows/, and
      # GitHub rejects such a ref push unless the pushing identity holds the
      # Workflows permission — which the App has and the default token cannot
      # be granted (there is no `workflows` scope in the permissions block).
      # App token scoped with the Workflows permission. Sliding v<MAJOR> can
      # move the tag across a commit that edits a file under .github/workflows/,
      # and GitHub rejects such a ref update (both `git push` and the REST API)
      # unless the pushing identity holds the Workflows permission. The default
      # GITHUB_TOKEN can't carry it, and the App token only carries it if the
      # GitHub App has been granted "Workflows: Read & write" in its settings.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Slide major tag to latest mise@ release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          # Newest exact release tag cut by semantic-release, e.g. mise@4.2.0.
          LATEST="$(git tag -l 'mise@*' | sort -V | tail -1)"
          if [ -z "$LATEST" ]; then
            echo "No mise@* tags found; nothing to slide."
            exit 0
          fi
          VERSION="${LATEST#mise@}"
          MAJOR="${VERSION%%.*}"
          if ! [[ "$MAJOR" =~ ^[0-9]+$ ]]; then
            echo "::error::could not parse major version from tag $LATEST" >&2
            exit 1
          fi
          SLIDING="v${MAJOR}"
          TARGET="$(git rev-list -n1 "$LATEST")"
          CURRENT="$(git rev-list -n1 "$SLIDING" 2>/dev/null || true)"
          if [ "$TARGET" = "$CURRENT" ]; then
            echo "$SLIDING already points at $TARGET ($LATEST); nothing to do."
            exit 0
          fi
          echo "Pointing $SLIDING at $TARGET (from $LATEST)"
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git tag -f "$SLIDING" "$TARGET"
          git push origin "$SLIDING" --force
