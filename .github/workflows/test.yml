name: test
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Retry crates.io fetches — registry reads occasionally drop with an SSL
      # eof on the runners; without this a single blip fails the whole job.
      CARGO_NET_RETRY: "5"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # tests/internal_action_refs.rs needs the release tags and the commits
          # since the latest one to know which major is about to ship.
          fetch-depth: 0

      - name: Install Rust toolchain
        run: rustup toolchain install stable --component rustfmt,clippy --profile minimal

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: cargo-nextest

      - name: Lint
        # lint auto-fixes; a dirty tree means something needed fixing.
        run: cargo fmt --all && cargo clippy --all-targets --all-features --fix --allow-dirty --allow-staged -- -D warnings && git diff --exit-code

      - name: Test
        run: cargo nextest run --locked --color always && cargo test --doc --locked
