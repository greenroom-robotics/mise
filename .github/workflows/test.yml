name: test
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Retry crates.io fetches — registry reads occasionally drop with an SSL
      # eof on the runners; without this a single blip fails the whole job.
      CARGO_NET_RETRY: "5"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # tests/internal_action_refs.rs needs the release tags and the commits
          # since the latest one to know which major is about to ship.
          fetch-depth: 0

      - name: Install Rust toolchain
        run: rustup toolchain install stable --component rustfmt,clippy --profile minimal

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets --locked

      - name: Install nextest
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: nextest

      - name: Test
        # nextest runs each test in its own process, isolating tests that
        # mutate process-global state (e.g. the $GITHUB_OUTPUT env var).
        # --color always: CI has no TTY, so force ANSI color in the logs.
        run: cargo nextest run --locked --color always

      - name: Doc tests
        # nextest does not run doctests; cover them separately.
        run: cargo test --doc --locked
