name: test
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Retry crates.io fetches — registry reads occasionally drop with an SSL
      # eof on the runners; without this a single blip fails the whole job.
      CARGO_NET_RETRY: "5"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # tests/internal_action_refs.rs needs the release tags and the commits
          # since the latest one to know which major is about to ship.
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.84.2
          locked: true
          environments: dev
          cache: true

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Lint
        run: pixi run lint-check

      - name: Test
        run: pixi run test
