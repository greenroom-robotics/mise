# Reusable workflow: fan a multi-package repo's `mise ci test` across one runner
# per package (matrix), instead of looping all packages sequentially on one
# runner. Each package builds in full isolation — no shared build/, no CPU/RAM
# contention — at the cost of repeating the setup on each runner.
#
# Single-package repos don't need this; they keep using the actions/test
# composite directly. This wrapper just discovers packages → matrix → composite.
#
# Usage (in a consumer repo's .github/workflows/test.yml):
#
#   jobs:
#     test:
#       uses: greenroom-robotics/mise/.github/workflows/ci-test.yml@v8
#       with:
#         runner: runs-on=${{ github.run_id }}/runner=...
#         package-dir: packages
#         changed-only: true        # PRs test only changed packages
#         jobs: |
#           default:test
#       secrets:
#         gh-app-client-id: ${{ secrets.GH_APP_CLIENT_ID }}
#         gh-app-private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
#         azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
#         azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
#         azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
name: mise ci test (matrix)

on:
  workflow_call:
    inputs:
      runner:
        description: runs-on label/expression for all jobs (e.g. a runs-on.com dynamic runner).
        required: true
        type: string
      exclude-packages:
        description: 'JSON array of packages to drop from discovery entirely (no host or container job). For packages that can''t be tested in CI yet. Default [] tests everything found.'
        required: false
        type: string
        default: "[]"
      package:
        description: Single package to test (default - all packages under package-dir).
        required: false
        type: string
        default: ""
      package-dir:
        description: 'One or more directories containing per-package pixi workspaces, whitespace-separated (space- or newline-separated both work), e.g. `libs` or `libs\nprojects/gama_vessel_variants`. Packages are discovered and unioned across every dir given; a package name found under more than one dir is an error.'
        required: false
        type: string
        default: packages
      report-dir:
        description: Directory to collect JUnit XML test reports into.
        required: false
        type: string
        default: test-reports
      jobs:
        description: Newline-separated `<env>:<task>` pairs to run per package (passed to actions/test).
        required: false
        type: string
        default: ""
      locked:
        description: Require the committed pixi.lock to satisfy the manifest and fail on drift. On by default; set false to opt out and re-resolve from the manifest (conda-forge style).
        required: false
        type: boolean
        default: true
      build-only:
        description: Skip running tests; still verify the lock (per `locked`) and that each package's pixi environment installs/builds. For workspaces with no tests (e.g. a docker-build variant) that still want lock/build verification in CI.
        required: false
        type: boolean
        default: false
      include-workspaces:
        description: 'Also discover workspace-only manifests (`[workspace]`, no `[package]`) under package-dir that have a committed pixi.lock, alongside regular packages — e.g. a docker-build variant workspace with no publishable package but still pixi environments/tasks to test. A workspace gets its own matrix leg exactly like a package (a workspace''s dir basename is its discovered name); pair with `build-only` when it has nothing to test, only a lock/build to verify. Off by default.'
        required: false
        type: boolean
        default: false
      changed-only:
        description: On pull_request, test only packages whose files changed (push/dispatch always test all).
        required: false
        type: boolean
        default: false
      submodules:
        description: 'Init the repo''s git submodules (recursively) on each test leg, authenticated with the GH App token so private org submodules work regardless of the URL form in .gitmodules. For repos whose packages build from submodule-sourced inputs (e.g. a path dep into a vendored proto contract).'
        required: false
        type: boolean
        default: false
      lfs:
        description: Fetch Git LFS objects for the package under test (for repos with LFS test fixtures). Scoped to the package's own directory — a leg testing a package with no LFS files downloads nothing. A repo .lfsconfig `fetchexclude` still applies unless `lfs-ignore-config-exclude` is set.
        required: false
        type: boolean
        default: false
      lfs-include:
        description: 'Extra git-lfs include glob(s), comma-separated, fetched on every leg when `lfs` is on. For fixtures shared across packages (e.g. `packages/foo_bin/bin/**`). The package''s own dir is always included.'
        required: false
        type: string
        default: ""
      lfs-ignore-config-exclude:
        description: 'Ignore the repo .lfsconfig `fetchexclude` for the CI pull, making the include list authoritative. ONLY for repos whose fetchexclude is a blanket `*` (set to stop local auto-fetch). Leave false where fetchexclude names specific paths — overriding it there re-downloads exactly the artefacts it exists to skip, on every matrix leg.'
        required: false
        type: boolean
        default: false
      timeout-minutes:
        description: Per-package test job timeout. Bounds a hung test (e.g. a DDS teardown deadlock that no per-test timeout can catch) instead of inheriting GitHub's 360-minute default.
        required: false
        type: number
        default: 60
      host-setup:
        description: 'Optional bash run on the host runner before each package test (e.g. load a kernel module, bring up a vcan interface, add udev rules). Runs once per matrix leg since each leg is a fresh runner. Empty default is a no-op.'
        required: false
        type: string
        default: ""
    secrets:
      gh-app-client-id:
        required: true
      gh-app-private-key:
        required: true
      azure-client-id:
        required: true
      azure-tenant-id:
        required: true
      azure-subscription-id:
        required: true

jobs:
  # Cheap: list package dirs (optionally narrowed to changed ones on PRs) and
  # emit a matrix. No proxy/Azure/mise here so it costs seconds, not a full setup.
  discover:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      pull-requests: read   # paths-filter reads the PR's changed-file list
    outputs:
      packages: ${{ steps.assemble.outputs.packages }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0   # paths-filter diffs against the base ref

      # Discovery lives in a composite action (not an inline script) because
      # reusable-workflow steps run in the CALLER's checkout — a repo-local
      # `.github/scripts/...` path 404s for every external caller. The
      # composite ships its own script, resolved via github.action_path.
      # Emits `all` (JSON array) + `map` (paths-filter map). The map's filter
      # for each package is its own dir plus the dirs of its TRANSITIVE
      # path-dep closure, so a change to a leaf retriggers every consumer
      # whose committed pixi.lock transitively pins it. Single root-[package]
      # repos use the test composite directly, not this workflow.
      - id: all
        uses: greenroom-robotics/mise/.github/actions/discover@v8
        with:
          package: ${{ inputs.package }}
          package-dir: ${{ inputs.package-dir }}
          include-workspaces: ${{ inputs.include-workspaces }}

      - id: filter
        if: ${{ inputs.changed-only && inputs.package == '' && github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: ${{ steps.all.outputs.map }}
          list-files: none

      # `package-dir` can list more than one dir (whitespace-separated); build
      # the exclude-list dynamically so a change under ANY of them is still
      # attributed to a package, not treated as "outside".
      - id: outside-filters
        if: ${{ inputs.changed-only && inputs.package == '' && github.event_name == 'pull_request' }}
        shell: bash
        env:
          PACKAGE_DIR: ${{ inputs.package-dir }}
        run: |
          set -euo pipefail
          {
            echo "filters<<__EOF__"
            echo "other:"
            echo "  - '**'"
            echo "  - '!docs/**'"
            for dir in $PACKAGE_DIR; do
              echo "  - '!$dir/**'"
            done
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      # A change outside package-dir and docs/ — a workflow, a root config, a shared
      # test fixture — can affect any package, and there is no reliable way to
      # attribute it to one. Run everything instead of silently testing nothing.
      #
      # Separate step because predicate-quantifier is action-level, not per-filter:
      # the default ('some') would fire on every PR since '**' matches everything,
      # and setting 'every' on the step above would require a file to match ALL of a
      # package's globs at once, so changed-only would select nothing.
      - id: outside
        if: ${{ inputs.changed-only && inputs.package == '' && github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          list-files: none
          filters: ${{ steps.outside-filters.outputs.filters }}

      - id: assemble
        shell: bash
        env:
          ALL: ${{ steps.all.outputs.all }}
          DIRS: ${{ steps.all.outputs.dirs }}
          CHANGED: ${{ steps.filter.outputs.changes }}
          FILTER_RAN: ${{ steps.filter.outcome }}
          OUTSIDE: ${{ steps.outside.outputs.other }}
          EXCLUDE_PACKAGES: ${{ inputs.exclude-packages }}
        run: |
          set -euo pipefail
          # Use the filtered set only when paths-filter actually ran; otherwise
          # (push, dispatch, changed-only off) test everything. A change outside
          # package-dir/docs wins over the filtered subset — see the `outside` step.
          if [ "$OUTSIDE" = "true" ]; then
            echo "change outside ${{ inputs.package-dir }}/ and docs/ — testing all packages"
            packages="$ALL"
          elif [ "$FILTER_RAN" = "success" ]; then
            packages="$CHANGED"
          else
            packages="$ALL"
          fi
          # Drop excluded packages from the whole run.
          packages=$(jq -cn --argjson p "$packages" --argjson x "$EXCLUDE_PACKAGES" '$p - $x')
          # Pair each package name with the package-dir it was discovered
          # under (package-dir can list more than one dir) so the test matrix
          # below can address each package's manifest directly.
          packages=$(jq -cn --argjson names "$packages" --argjson dirs "$DIRS" \
            '[$names[] | {name: ., dir: $dirs[.]}]')
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "Packages: $packages"

  # Run each package's tests on `runner`.
  test:
    needs: discover
    if: needs.discover.outputs.packages != '[]'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      id-token: write      # Azure OIDC login in setup
      checks: write        # dorny/test-reporter publishes a check per package
    strategy:
      fail-fast: false     # one package failing must not cancel the others
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # checkout's own `submodules:` input authenticates with GITHUB_TOKEN,
      # which is scoped to the calling repo — a private org submodule 404s.
      # Mint the GH App installation token (org-wide) and fetch them ourselves.
      - name: Generate GitHub App token
        if: inputs.submodules
        id: submodule-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.gh-app-client-id }}
          private-key: ${{ secrets.gh-app-private-key }}
          owner: ${{ github.repository_owner }}
      - name: Fetch submodules
        if: inputs.submodules
        shell: bash
        env:
          GH_TOKEN: ${{ steps.submodule-token.outputs.token }}
        run: |
          set -euo pipefail
          # Map both remote forms straight to the token URL — git applies
          # insteadOf once (no chaining), so ssh→https would miss a second rule.
          key="url.https://x-access-token:${GH_TOKEN}@github.com/.insteadOf"
          git config "$key" "https://github.com/"
          git config --add "$key" "git@github.com:"
          git submodule update --init --recursive --depth=1
          git config --unset-all "$key"

      # Checkout leaves LFS pointers alone; pull only the objects this leg can
      # actually use. `lfs: true` on checkout would drag the repo's ENTIRE LFS
      # store onto every matrix leg, including legs whose package has no LFS
      # files at all. Fixtures shared across packages go in `lfs-include`.
      - name: Fetch LFS objects for ${{ matrix.package.name }}
        if: inputs.lfs
        shell: bash
        env:
          PACKAGE: ${{ matrix.package.name }}
          PACKAGE_DIR: ${{ matrix.package.dir }}
          EXTRA: ${{ inputs.lfs-include }}
          IGNORE_CONFIG_EXCLUDE: ${{ inputs.lfs-ignore-config-exclude }}
        run: |
          set -euo pipefail
          include="${PACKAGE_DIR:+$PACKAGE_DIR/}$PACKAGE/**"
          if [ -n "$EXTRA" ]; then include="$include,$EXTRA"; fi
          # git-lfs overrides lfs.fetchinclude and lfs.fetchexclude INDEPENDENTLY:
          # passing only --include leaves a configured fetchexclude in force, so a
          # repo with `fetchexclude = *` fetches nothing at all. --exclude="" fixes
          # that, but it also discards a TARGETED fetchexclude, which for a repo with
          # large committed artefacts is a deliberate cost control worth GBs per leg.
          # Hence opt-in: never add --exclude="" unconditionally here.
          if [ "$IGNORE_CONFIG_EXCLUDE" = "true" ]; then
            echo "git lfs pull --include=$include --exclude="
            git lfs pull --include="$include" --exclude=""
          else
            echo "git lfs pull --include=$include"
            git lfs pull --include="$include"
          fi

      - name: Host setup
        if: inputs.host-setup != ''
        shell: bash
        run: ${{ inputs.host-setup }}
      - uses: greenroom-robotics/mise/.github/actions/test@v8
        with:
          gh-app-client-id: ${{ secrets.gh-app-client-id }}
          gh-app-private-key: ${{ secrets.gh-app-private-key }}
          azure-client-id: ${{ secrets.azure-client-id }}
          azure-tenant-id: ${{ secrets.azure-tenant-id }}
          azure-subscription-id: ${{ secrets.azure-subscription-id }}
          package: ${{ matrix.package.name }}
          package-dir: ${{ matrix.package.dir }}
          report-dir: ${{ inputs.report-dir }}
          check-name: 'Test Report (pixi): ${{ matrix.package.name }}'
          jobs: ${{ inputs.jobs }}
          locked: ${{ inputs.locked }}
          build-only: ${{ inputs.build-only }}

  # Single stable status to require in branch protection. Matrix legs have
  # per-package names that can't be required directly; this collapses them into
  # one check that is green only when discovery succeeded and every leg passed.
  # An empty change set (PR touched no package) is a pass, not a failure.
  result:
    needs: [discover, test]
    if: always()
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - shell: bash
        env:
          TEST: ${{ needs.test.result }}
        run: |
          echo "discover=${{ needs.discover.result }} test=$TEST packages=${{ needs.discover.outputs.packages }}"
          if [ "${{ needs.discover.result }}" != "success" ]; then
            echo "::error::package discovery failed"; exit 1
          fi
          if [ "${{ needs.discover.outputs.packages }}" = "[]" ]; then
            echo "no packages to test — nothing changed"; exit 0
          fi
          # The test job is 'skipped' when the package set is empty — only an
          # actual failure should fail the gate.
          if [ "$TEST" != "success" ] && [ "$TEST" != "skipped" ]; then
            echo "::error::one or more package test jobs did not pass"; exit 1
          fi
