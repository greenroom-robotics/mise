name: Run pre-commit lint
description: 'Set up the mise CI environment and run `pre-commit run --all-files` with tools from the lint-tools-meta conda package, without needing a pixi workspace in the calling repo.'
author: Greenroom Robotics

inputs:
  gh-app-client-id:
    description: GitHub App client id used to mint a token for private deps.
    required: true
  gh-app-private-key:
    description: GitHub App private key (PEM).
    required: true
  azure-client-id:
    description: AZURE_CLIENT_ID — federated identity bound to the calling repo.
    required: true
  azure-tenant-id:
    description: AZURE_TENANT_ID for the channel storage account.
    required: true
  azure-subscription-id:
    description: AZURE_SUBSCRIPTION_ID for the channel storage account.
    required: true
  skip-hooks:
    description: Comma-separated pre-commit hook ids to skip (exported as `SKIP`).
    required: false
    default: ""
  mask-channels:
    description: Mask Azure container names in the log. Set to 'false' only in private repos.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: greenroom-robotics/mise/.github/actions/setup@v9
      with:
        gh-app-client-id: ${{ inputs.gh-app-client-id }}
        gh-app-private-key: ${{ inputs.gh-app-private-key }}
        azure-client-id: ${{ inputs.azure-client-id }}
        azure-tenant-id: ${{ inputs.azure-tenant-id }}
        azure-subscription-id: ${{ inputs.azure-subscription-id }}
        mask-channels: ${{ inputs.mask-channels }}

    - name: Cache pre-commit environments
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.pre-commit-config.yaml') }}
        restore-keys: pre-commit-${{ runner.os }}-${{ runner.arch }}-

    - name: Run pre-commit
      shell: bash
      env:
        SKIP: ${{ inputs.skip-hooks }}
      run: |
        pixi exec \
          -c az://stgrcondachannel.blob.core.windows.net/general \
          -c https://prefix.dev/conda-forge \
          --spec 'lint-tools-meta 0.*' \
          -- pre-commit run --all-files --show-diff-on-failure --color=always
