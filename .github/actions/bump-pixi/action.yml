name: Bump pixi.toml(s) and tag the release
description: >-
  Release one or more packages at an externally-chosen version: write it into
  each package's pixi.toml via `mise ci bump-pixi`, make one commit containing
  every bump, tag `<pkg>@<version>` per package at that commit and push all of
  it. For versions owned by something other than the packages' own commits
  (e.g. a product image release) — the farm builds from pixi.toml at the
  tagged rev, so tagging without the bump would republish the old version.
  Pair with the recipes-pr action, which discovers the tags and opens the
  recipe PR. Requires a checkout of the branch to bump with enough history to
  commit (fetch-depth 0 is simplest).
author: Greenroom Robotics

inputs:
  version:
    description: Version to release, no leading 'v'. All packages get this version.
    required: true
  pixi-toml:
    description: >-
      Repo-relative path(s) to each package's pixi.toml,
      whitespace/newline-separated. One path bumps, commits and tags a single
      package; several paths are bumped in one commit with one tag per
      package.
    required: true
  branch:
    description: Branch the bump commit is pushed to. Must be checked out.
    required: false
    default: main
  gh-app-client-id:
    description: GitHub App client id used to mint the push token.
    required: true
  gh-app-private-key:
    description: GitHub App private key (PEM).
    required: true
  azure-client-id:
    description: AZURE_CLIENT_ID — federated identity bound to the calling repo.
    required: true
  azure-tenant-id:
    description: AZURE_TENANT_ID for the channel storage account.
    required: true
  azure-subscription-id:
    description: AZURE_SUBSCRIPTION_ID for the channel storage account.
    required: true

outputs:
  tag:
    description: >-
      The `<pkg>@<version>` tag(s) created and pushed, space-separated, in
      pixi-toml input order.
    value: ${{ steps.bump.outputs.tag }}

runs:
  using: composite
  steps:
    - uses: greenroom-robotics/mise/.github/actions/setup@v8
      with:
        gh-app-client-id: ${{ inputs.gh-app-client-id }}
        gh-app-private-key: ${{ inputs.gh-app-private-key }}
        azure-client-id: ${{ inputs.azure-client-id }}
        azure-tenant-id: ${{ inputs.azure-tenant-id }}
        azure-subscription-id: ${{ inputs.azure-subscription-id }}

    - name: Bump, commit, tag and push
      id: bump
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        PIXI_TOML: ${{ inputs.pixi-toml }}
        BRANCH: ${{ inputs.branch }}
      run: |
        set -euo pipefail
        # actions/checkout persists GITHUB_TOKEN in the remote's auth
        # extraheader, and that Authorization header shadows the rewritten
        # URL's App token. Drop it so the pushes below go out as the App —
        # only the App has the branch-ruleset bypass.
        git config --local --unset-all "http.https://github.com/.extraheader" || true
        manifests=($PIXI_TOML)
        # bump-pixi validates every path before writing any file, so a bad
        # path aborts with the working tree untouched.
        pixi run --manifest-path "$MISE_MANIFEST" mise ci bump-pixi \
          --version="$VERSION" --pixi-toml "${manifests[@]}"
        names=()
        tags=()
        for manifest in "${manifests[@]}"; do
          name="$(python3 -c 'import tomllib, sys; print(tomllib.load(open(sys.argv[1], "rb"))["package"]["name"])' "$manifest")"
          names+=("$name")
          tags+=("${name}@${VERSION}")
        done
        if [ "${#names[@]}" -eq 1 ]; then
          git commit -am "chore(release): ${names[0]} ${VERSION} [skip ci]"
        else
          git commit -am "chore(release): ${#names[@]} packages ${VERSION} [skip ci]" \
            -m "$(printf '%s\n' "${tags[@]}")"
        fi
        # -f/--force so a job re-run after a partial release doesn't die here
        for tag in "${tags[@]}"; do
          git tag -f "$tag"
        done
        git push origin "HEAD:${BRANCH}"
        git push -f origin "${tags[@]}"
        echo "tag=${tags[*]}" >> "$GITHUB_OUTPUT"
