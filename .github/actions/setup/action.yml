name: Set up mise CI environment
description: 'Provision a GitHub App token, Azure credentials, the Greenroom pixi fork (native az:// channel support), and (unless skip-pixi is set) the mise CLI pinned to this action version. Public action — callable directly from custom workflows.'
author: Greenroom Robotics

inputs:
  gh-app-client-id:
    description: GitHub App client id used to mint a token for private deps.
    required: true
  gh-app-private-key:
    description: GitHub App private key (PEM) corresponding to gh-app-client-id.
    required: true
  azure-client-id:
    description: AZURE_CLIENT_ID — federated identity bound to the calling repo.
    required: true
  azure-tenant-id:
    description: AZURE_TENANT_ID for the channel storage account.
    required: true
  azure-subscription-id:
    description: AZURE_SUBSCRIPTION_ID for the channel storage account.
    required: true
  pixi-version:
    description: Greenroom pixi fork release version (see greenroom-robotics/pixi releases).
    required: false
    default: "0.73.1"
  skip-pixi:
    description: Skip the pixi install step. For repos whose pixi work happens inside a container build — the App token, Azure login, and git auth still run on the host.
    required: false
    default: "false"

outputs:
  gh-token:
    description: GitHub App installation token for downstream steps.
    value: ${{ steps.app-token.outputs.token }}

runs:
  using: composite
  steps:
    - name: Generate GitHub App token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.gh-app-client-id }}
        private-key: ${{ inputs.gh-app-private-key }}
        # Scope the token to the whole installation, not just the calling
        # repo, so downstream steps can reach other private org repos.
        owner: ${{ github.repository_owner }}

    # Export the App's bot git identity into the job env so every later step
    # in this job — including the release action's semantic-release run, in
    # both the bundled-setup and skip-setup paths — commits as the App rather
    # than semantic-release-bot, with no per-value input plumbing. The numeric
    # user id makes the noreply email link the commit to the App account so
    # GitHub renders it as the App (avatar + Verified badge), instead of the
    # free-text label a hardcoded name would produce.
    - name: Export App git identity
      shell: bash
      env:
        APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        set -euo pipefail
        user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
        name="${APP_SLUG}[bot]"
        email="${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
        {
          echo "GIT_AUTHOR_NAME=${name}"
          echo "GIT_AUTHOR_EMAIL=${email}"
          echo "GIT_COMMITTER_NAME=${name}"
          echo "GIT_COMMITTER_EMAIL=${email}"
        } >> "$GITHUB_ENV"

    - name: Azure login (OIDC)
      uses: azure/login@v3
      with:
        client-id: ${{ inputs.azure-client-id }}
        tenant-id: ${{ inputs.azure-tenant-id }}
        subscription-id: ${{ inputs.azure-subscription-id }}

    - name: Configure git auth for private GitHub deps
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

    # Install the Greenroom pixi fork (native az:// Azure Blob channel support;
    # upstream pixi cannot read our az:// channels). Only the binary — we do not
    # install a consumer environment for the CI orchestration tools (pixi/mise).
    # Reading az:// channels only needs the ambient azure/login above (SAS is
    # minted from it); explicit SAS is only required for writes (reindex).
    - name: Install pixi (Greenroom fork)
      if: inputs.skip-pixi != 'true'
      shell: bash
      env:
        PIXI_GR_VERSION: ${{ inputs.pixi-version }}
      run: |
        set -euo pipefail
        installer="${RUNNER_TEMP}/install-pixi-gr.sh"
        curl -fsSL "https://github.com/greenroom-robotics/pixi/releases/download/pixi-gr@${PIXI_GR_VERSION}/install.sh" -o "$installer"
        sh "$installer"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    # Write a dedicated pixi manifest that depends solely on mise, pinned to the
    # exact version this action ships, then install it. Downstream actions run
    # mise via `pixi run --manifest-path "$MISE_MANIFEST"` (exported below)
    #
    # The version is read from THIS repo's root pixi.toml [package].version —
    # bumped on every release, with the major tag (v<MAJOR>) slid onto that
    # commit. The spec is `<=version` (a ceiling, not `==`): between the bump
    # commit landing (tag moves, version reads as new) and the new mise being
    # published to the channel, `==` can't resolve and every action fails.
    # `<=` falls back to the latest *published* version during that gap while
    # never installing something newer than the action ships. The channel is
    # the org's `general` az:// Azure Blob channel, where mise is published;
    # the pixi fork reads it directly using the ambient azure/login session.
    - name: Install mise
      if: inputs.skip-pixi != 'true'
      shell: bash
      run: |
        set -euo pipefail
        version="$(python3 -c 'import tomllib; print(tomllib.load(open("'"${GITHUB_ACTION_PATH}"'/../../../pixi.toml","rb"))["package"]["version"])')"
        if [ -z "$version" ]; then
          echo "::error::could not read [package].version from the action's pixi.toml" >&2
          exit 1
        fi
        manifest_dir="${RUNNER_TEMP}/mise-tool"
        mkdir -p "$manifest_dir"
        cat > "${manifest_dir}/pixi.toml" <<EOF
        [workspace]
        name = "mise-tool"
        channels = ["az://stgrcondachannel.blob.core.windows.net/general", "https://prefix.dev/conda-forge"]
        platforms = ["linux-64", "linux-aarch64"]

        [dependencies]
        mise = "<=${version}"
        EOF
        echo "Installing mise<=${version} (latest published, ceiling ${version}) from a dedicated tool manifest"
        pixi install --manifest-path "${manifest_dir}/pixi.toml"
        # Export the manifest path so downstream actions invoke mise from it.
        echo "MISE_MANIFEST=${manifest_dir}/pixi.toml" >> "$GITHUB_ENV"
