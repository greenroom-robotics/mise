name: Discover packages
description: 'Discover per-package pixi workspaces under package-dir and emit `all` (JSON array of package names), `map` (a dorny/paths-filter YAML map keyed by package, each including its transitive path-dep closure) and `dirs` (JSON object mapping each package name to its owning package-dir). Ships its own script so it works from any caller''s checkout, not just this repo''s.'
author: Greenroom Robotics

inputs:
  package:
    description: Single package to discover (default - all packages under package-dir).
    required: false
    default: ""
  package-dir:
    description: 'One or more directories containing per-package pixi workspaces, whitespace-separated (space- or newline-separated both work), e.g. `libs` or `libs\nprojects/foo`. Packages are unioned across every dir; a package name found under more than one dir is an error.'
    required: false
    default: packages
  include-workspaces:
    description: 'Also discover workspace-only manifests (`[workspace]`, no `[package]`) that have a committed pixi.lock, alongside regular packages — e.g. a docker-build variant workspace with no publishable package but still pixi environments/tasks to test. A workspace''s discovered name is its dir basename (same convention as a package). Off by default.'
    required: false
    default: "false"

outputs:
  all:
    description: Compact JSON array of discovered package dir-names, unioned across every package-dir given.
    value: ${{ steps.discover.outputs.all }}
  map:
    description: dorny/paths-filter YAML map — each package's filter is its own dir glob plus the dir globs of every sibling it transitively path-depends on.
    value: ${{ steps.discover.outputs.map }}
  dirs:
    description: Compact JSON object mapping each discovered package name to the single package-dir it was found under.
    value: ${{ steps.discover.outputs.dirs }}

runs:
  using: composite
  steps:
    - id: discover
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
        PACKAGE_DIR: ${{ inputs.package-dir }}
        INCLUDE_WORKSPACES: ${{ inputs.include-workspaces }}
      run: python3 "$GITHUB_ACTION_PATH/discover_packages.py"
